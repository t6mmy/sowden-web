<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1b24">
  <meta name="description" content="Our family links.">
  <title>Our Family Links</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <p class="moon" aria-hidden="true">☾</p>
      <h1>Our Family Links</h1>

    <ul class="links">
      <li>
        <a href="/31-nights-of-fright/">
          <span class="icon" aria-hidden="true">🦇</span>
          <span class="text">
            <span class="title">31 Nights of Fright</span>
            <span class="note">One scary movie every night in October</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
        <a href="budget planner/">
          <span class="icon" aria-hidden="true">💵</span>
          <span class="text">
            <span class="title">Budget Planner</span>
            <span class="note">important</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>

      <!-- To add a link, copy the <li> above and change the href, icon, title and note. -->
    </ul>

    <p class="more">More links coming soon.</p>
  </main>
</body>
</html>
